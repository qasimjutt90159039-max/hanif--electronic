      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="wMetal_kenwood-washing-machine-kwm-950-semi-auto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="wSh_kenwood-washing-machine-kwm-950-semi-auto" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg_kenwood-washing-machine-kwm-950-semi-auto)"/>

